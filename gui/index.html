<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>herdr GUI (v0)</title>

  <body>
    <main class="container">
      <h1>herdr GUI</h1>
